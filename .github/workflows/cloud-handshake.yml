name: Private audio to SRT - ephemeral GitHub CPU runner
on:
  workflow_call:
    inputs:
      transport:
        type: string
        required: true
        default: drive
      encrypted_drive_file_id:
        type: string
        required: false
      output_public_key:
        type: string
        required: true
      model:
        type: string
        required: true
        default: large-v3-turbo
      language:
        type: string
        required: true
        default: auto
      alignment:
        type: string
        required: true
        default: 'off'
      chunk_seconds:
        type: number
        required: true
        default: 600
  workflow_dispatch:
    inputs:
      transport:
        description: 'Ciphertext channel (drive legacy or short-lived signed link)'
        type: choice
        required: true
        default: drive
        options:
          - drive
          - signed-url
      encrypted_drive_file_id:
        description: 'Only for legacy drive transport: encrypted-only Drive ID'
        type: string
        required: false
      output_public_key:
        description: 'Public RSA key for encrypted subtitle return (never private key)'
        type: string
        required: true
      model:
        description: 'Offline open-weight ASR model; Qwen1.7B is text-only benchmark (not SRT)'
        type: choice
        required: true
        default: large-v3-turbo
        options:
          - small
          - tiny
          - base
          - medium
          - large-v3
          - large-v3-turbo
          - breeze-asr-25
          - qwen3-asr-1.7b
          - fun-asr-nano-2512
      language:
        description: 'Auto detect, or force Chinese/English'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - zh
          - en
      alignment:
        description: 'Optional offline Qwen word/character alignment (CPU, slower)'
        type: choice
        default: 'off'
        required: true
        options:
          - 'off'
          - qwen
      chunk_seconds:
        description: 'Continuous time segments (0 disables; default 600s)'
        type: number
        default: 600
        required: true
permissions:
  contents: read
  issues: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Verify FFmpeg (install only if unavailable)
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo 'Using preinstalled FFmpeg and ffprobe'
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install offline inference packages
        run: |
          python -m pip install -r requirements.txt 'cryptography>=42,<48' huggingface_hub
      - name: Install CPU candidate C/C++ build dependencies
        if: ${{ inputs.model == 'qwen3-asr-1.7b' || inputs.model == 'fun-asr-nano-2512' }}
        run: |
          sudo apt-get install -y -qq build-essential libopenblas-dev git curl
      - name: Install optional official Qwen CPU alignment stack
        if: ${{ inputs.alignment == 'qwen' }}
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=5.13.0,<6' librosa sentencepiece
      - name: Generate ephemeral keys, privately transcribe on GitHub and encrypt output
        if: ${{ inputs.model != 'qwen3-asr-1.7b' && inputs.model != 'fun-asr-nano-2512' }}
        env:
          DRIVE_ID: ${{ inputs.encrypted_drive_file_id }}
          INPUT_TRANSPORT: ${{ inputs.transport }}
          GITHUB_TOKEN: ${{ github.token }}
          OUTPUT_PUB: ${{ inputs.output_public_key }}
          MODEL_NAME: ${{ inputs.model }}
          LANGUAGE: ${{ inputs.language }}
          CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
          ALIGNMENT: ${{ inputs.alignment }}
        run: |
          python -m tools.cloud_handshake --transport "$INPUT_TRANSPORT" --drive-id "$DRIVE_ID" --output-pub "$OUTPUT_PUB" --model "$MODEL_NAME" --language "$LANGUAGE" --chunk-seconds "$CHUNK_SECONDS" --alignment "$ALIGNMENT"
      - name: Private Qwen3-ASR 1.7B CPU benchmark (encrypted text, no SRT)
        if: ${{ inputs.model == 'qwen3-asr-1.7b' }}
        env:
          INPUT_TRANSPORT: ${{ inputs.transport }}
          DRIVE_ID: ${{ inputs.encrypted_drive_file_id }}
          OUTPUT_PUB: ${{ inputs.output_public_key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m tools.qwen_private_benchmark --model-size large --transport "$INPUT_TRANSPORT" --drive-id "$DRIVE_ID" --output-pub "$OUTPUT_PUB"

      - name: Private Fun-ASR-Nano GGUF CPU benchmark (encrypted candidate)
        if: ${{ inputs.model == 'fun-asr-nano-2512' }}
        env:
          INPUT_TRANSPORT: ${{ inputs.transport }}
          DRIVE_ID: ${{ inputs.encrypted_drive_file_id }}
          OUTPUT_PUB: ${{ inputs.output_public_key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m tools.funasr_private_benchmark --transport "$INPUT_TRANSPORT" --drive-id "$DRIVE_ID" --output-pub "$OUTPUT_PUB"
