name: Private audio to SRT - ephemeral GitHub CPU runner
on:
  workflow_dispatch:
    inputs:
      encrypted_drive_file_id:
        description: 'ID of temporary public AES-GCM encrypted ciphertext (not audio)'
        type: string
        required: true
      output_public_key:
        description: 'Public RSA key for encrypted subtitle return (never private key)'
        type: string
        required: true
      model:
        description: 'Locally executed open-source Whisper weights'
        type: choice
        required: true
        default: small
        options:
          - small
          - tiny
          - base
          - medium
          - large-v3
permissions:
  contents: read
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for private audio normalization
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install offline inference packages
        run: |
          python -m pip install -r requirements.txt 'cryptography>=42,<48' huggingface_hub
      - name: Generate ephemeral keys, privately transcribe on GitHub and encrypt output
        env:
          DRIVE_ID: ${{ inputs.encrypted_drive_file_id }}
          OUTPUT_PUB: ${{ inputs.output_public_key }}
          MODEL_NAME: ${{ inputs.model }}
        run: |
          python tools/cloud_handshake.py --drive-id "$DRIVE_ID" --output-pub "$OUTPUT_PUB" --model "$MODEL_NAME"