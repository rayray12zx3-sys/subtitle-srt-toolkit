name: Cloud long-audio mixed-language and encrypted batch smoke (synthetic)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/batch-long-smoke.yml'
permissions:
  contents: read
jobs:
  real-whisper-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic audio tools and local open-source Whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install -r requirements.txt 'cryptography>=42,<48' huggingface_hub
      - name: Generate two synthetic voice clips, each spanning multiple 5-second chunks
        run: |
          espeak-ng -v en-us -s 140 -w /tmp/synthetic-a.wav 'Hello everyone. Today we will learn about language. This is a long transcript evaluation. We hope the recognition and the timing are correct. Hello again everyone.'
          espeak-ng -v en-us -s 135 -w /tmp/synthetic-b.wav 'Welcome to the second clip. This is a completely different audio recording. We need separate subtitles and time codes. The batch should be complete before returning the answer.'
      - name: Real GitHub CPU Whisper using production encrypted batch runner
        run: |
          python - <<'PY'
          import contextlib, io, sys
          from pathlib import Path
          from unittest.mock import patch
          from cryptography.hazmat.primitives.asymmetric import rsa
          from tools import cloud_handshake as worker
          from tools.secure_exchange import (prepare_batch_input, finish_batch_srt,
                                             make_return_key, parse_public_key,
                                             compact_public_key)
          from tools.batch_bundle import decode_bundle, is_batch_blob
          sources=[Path('/tmp/synthetic-a.wav'),Path('/tmp/synthetic-b.wav')]
          key_path=Path('/tmp/return-private.pem')
          return_public=make_return_key(key_path)
          runner_key=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          temp_packet=Path('/tmp/encrypted-two-clips.bin')
          prepare_batch_input(sources,runner_key.public_key(),temp_packet)
          ciphertext=temp_packet.read_bytes()
          assert not is_batch_blob(ciphertext)
          assert len(ciphertext)<64*1024*1024
          log=io.StringIO()
          args=['cloud_handshake.py','--drive-id','1234567890123456789012',
                '--output-pub',return_public,'--model','tiny',
                '--language','auto','--chunk-seconds','5']
          with patch.object(sys,'argv',args), patch.object(
              worker,'fetch_public_drive_blob',return_value=ciphertext), patch.object(
              worker.rsa,'generate_private_key',return_value=runner_key), contextlib.redirect_stdout(log):
              worker.main()
          text=log.getvalue()
          assert 'SRT_BATCH_ITEMS=2' in text
          out=Path('/tmp/finished-srt-batch')
          checks=finish_batch_srt(text,key_path,sources,out)
          assert len(checks)==2
          assert all(x['cues']>=2 for x in checks)
          assert all(x['last_cue_seconds']>5 for x in checks)
          assert len(list(out.glob('*.srt')))==2
          print('GITHUB_CPU_REAL_WHISPER_PRIVATE_BATCH_WITH_CHUNKS_PASS')
          print('BATCH_SYNTHETIC_CUES='+str(sum(x['cues'] for x in checks)))
          print('BATCH_SYNTHETIC_LONGEST_END_SEC='+str(max(x['last_cue_seconds'] for x in checks)))
          print('NO_PRIVATE_AUDIO_OR_SRT_PUBLISHED')
          PY
