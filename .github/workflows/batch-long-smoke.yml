name: Cloud chunked auto-language encrypted batch smoke (synthetic)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/batch-long-smoke.yml'
permissions:
  contents: read
jobs:
  real-whisper-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic audio tools and local open-source Whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install -r requirements.txt 'cryptography>=42,<48' huggingface_hub
      - name: Generate eight synthetic voice clips with different source lengths
        run: |
          espeak-ng -v en-us -s 140 -w /tmp/synthetic-a.wav 'Hello everyone. Today we will learn about language. This is a long transcript evaluation. We hope the recognition and the timing are correct. Hello again everyone.'
          espeak-ng -v en-us -s 135 -w /tmp/synthetic-b.wav 'Welcome to the second clip. This is a completely different audio recording. We need separate subtitles and time codes. The batch should be complete before returning the answer.'
          for i in 3 4 5 6 7 8; do
            espeak-ng -v en-us -s 135 -w "/tmp/synthetic-$i.wav" "This is clip $i. Keep each clip in the correct order. Restart subtitle timing for every separate recording."
          done
      - name: Real GitHub CPU Whisper using production encrypted batch runner
        run: |
          python - <<'PY'
          import contextlib, io, sys
          from pathlib import Path
          from unittest.mock import patch
          from cryptography.hazmat.primitives.asymmetric import rsa
          from tools import cloud_handshake as worker
          from tools.secure_exchange import (prepare_batch_input, finish_batch_srt,
                                             make_return_key, parse_public_key,
                                             compact_public_key)
          from tools.batch_bundle import decode_bundle, is_batch_blob
          sources=[Path('/tmp/synthetic-a.wav'),Path('/tmp/synthetic-b.wav')]
          sources.extend(Path(f'/tmp/synthetic-{i}.wav') for i in range(3,9))
          key_path=Path('/tmp/return-private.pem')
          return_public=make_return_key(key_path)
          runner_key=rsa.generate_private_key(public_exponent=65537,key_size=2048)
          temp_packet=Path('/tmp/encrypted-batch.bin')
          prepare_batch_input(sources,runner_key.public_key(),temp_packet)
          ciphertext=temp_packet.read_bytes()
          assert not is_batch_blob(ciphertext)
          assert len(ciphertext)<64*1024*1024
          log=io.StringIO()
          args=['cloud_handshake.py','--drive-id','1234567890123456789012',
                '--output-pub',return_public,'--model','large-v3-turbo',
                '--language','auto','--chunk-seconds','5']
          with patch.object(sys,'argv',args), patch.object(
              worker,'fetch_public_drive_blob',return_value=ciphertext), patch.object(
              worker.rsa,'generate_private_key',return_value=runner_key), patch.object(
              worker,'load_transcription_models',wraps=worker.load_transcription_models) as load, contextlib.redirect_stdout(log):
              worker.main()
              assert load.call_count==1, load.call_count
          text=log.getvalue()
          assert 'SRT_BATCH_ITEMS=8' in text
          for prefix in ('SRT_MODEL_DOWNLOAD_SECONDS=', 'SRT_MODEL_LOAD_COUNT=', 'SRT_MODEL_LOAD_SECONDS=',
                         'SRT_AUDIO_NORMALIZE_SECONDS=', 'SRT_ASR_GENERATION_SECONDS='):
              print(next(line for line in text.splitlines() if line.startswith(prefix)))
          out=Path('/tmp/finished-srt-batch')
          lesson=Path('/tmp/synthetic-lesson.txt')
          lesson.write_text('Hello everyone. Today we will learn about language.', encoding='utf-8')
          checks=finish_batch_srt(text,key_path,sources,out,lessons={1:lesson})
          assert len(checks)==8
          assert checks[0]['lesson_reference']['matched_english_words']>0
          assert all('lesson_reference' not in item for item in checks[1:])
          assert all(x['cues']>=2 for x in checks)
          assert all(x['last_cue_seconds']>5 for x in checks)
          assert len(list(out.glob('*.srt')))==8
          import re
          from tools.smart_segmentation import visual_width
          from delivery_gate import validate_delivery
          multiline=0
          for path,original in zip(sorted(out.glob('*.srt')),sources):
              validated=validate_delivery(original,path)
              assert validated['cues']>=2
              for block in re.split(r'\n\s*\n',path.read_text('utf-8-sig').strip()):
                  lines=block.splitlines()[2:]
                  assert 1<=len(lines)<=2, ('not 1-2 lines',len(lines))
                  assert all(line.strip() for line in lines)
                  assert all(visual_width(line)<=26 for line in lines), 'subtitle exceeded line width tolerance'
                  multiline+=len(lines)==2
          from tools.subtitle_quality import analyze_srt
          rate_warnings=0
          short_warnings=0
          for path in sorted(out.glob('*.srt')):
              metrics=analyze_srt(path,line_chars=12,max_lines=2,rate_limit=8.0)
              assert metrics['layout_ok'], 'Auto layout exceeded visible limits'
              rate_warnings+=metrics['reading_too_fast']
              short_warnings+=metrics['too_brief']
          print('SMART_V2_AGGREGATE_FAST_CUES='+str(rate_warnings))
          print('SMART_V2_AGGREGATE_SHORT_CUES='+str(short_warnings))
          print('SMART_V2_NONDESTRUCTIVE_QA_PASS')
          print('SMART_AUTOMATIC_TWO_LINE_LAYOUT_PASS')
          print('SMART_AUTOMATIC_TWO_LINE_CUES='+str(multiline))
          print('GITHUB_CPU_REAL_WHISPER_PRIVATE_BATCH_WITH_CHUNKS_PASS')
          print('BATCH_SYNTHETIC_CUES='+str(sum(x['cues'] for x in checks)))
          print('BATCH_SYNTHETIC_LONGEST_END_SEC='+str(max(x['last_cue_seconds'] for x in checks)))
          print('NO_PRIVATE_AUDIO_OR_SRT_PUBLISHED')
          PY
