name: Encrypted audio to SRT (GitHub-hosted CPU)
on:
  workflow_dispatch:
    inputs:
      encrypted_url:
        description: 'HTTPS URL to AES-256-GCM encrypted audio. NEVER use a raw audio URL.'
        type: string
        required: true
      model:
        description: 'Open-source Whisper CTranslate2 model (CPU)'
        type: choice
        required: true
        default: small
        options:
          - small
          - medium
          - large-v3
          - base
          - tiny
permissions:
  contents: read
concurrency:
  group: private-transcription-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SRT_TRANSPORT_KEY: ${{ secrets.SRT_TRANSPORT_KEY }}
      ENCRYPTED_URL: ${{ inputs.encrypted_url }}
      SELECTED_MODEL: ${{ inputs.model }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source local inference dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'cryptography>=42,<48'
      - name: Transcribe on this GitHub standard CPU runner; output ciphertext only
        shell: bash
        run: |
          set -euo pipefail
          python tools/cloud_runner.py --encrypted-url "$ENCRYPTED_URL" --model "$SELECTED_MODEL"