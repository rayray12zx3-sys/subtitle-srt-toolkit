name: Code checks (no media processing)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --only-binary=av 'av==18.1.1' 'numpy>=1.26,<3' 'cryptography>=42,<48' 'jieba==0.42.1' 'opencc-python-reimplemented>=0.1.7,<1'
      - run: python -m py_compile tools/runner_audio.py tools/gold_reference_review.py tools/funasr_private_benchmark.py tools/qwen_private_benchmark.py tools/asr_quality_benchmark.py tools/firered_private_runner.py tools/secure_exchange.py tools/chunking.py tools/batch_bundle.py tools/smart_segmentation.py tools/subtitle_timing.py tools/subtitle_quality.py tools/qwen_forced_alignment.py
      - run: python -m unittest discover -s tests -v
